[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-triage-lab"
version = "0.1.0"
description = "Reproducible experiments for typed agent memory compaction"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sese" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
memory-triage = "memory_triage.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_triage"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

